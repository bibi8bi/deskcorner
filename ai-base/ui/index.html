<title>AI接入底座 · 设置</title>
<script>
(() => {
  try {
    let 主题 = localStorage.getItem("ui:主题");
    if (!主题) {
      const 旧 = localStorage.getItem("ai-base-主题");
      if (旧 === "dark" || 旧 === "light")
        localStorage.setItem("ui:主题", 主题 = 旧);
    }
    localStorage.removeItem("ai-base-主题");
    if (["light", "dark", "eye"].includes(主题))
      document.documentElement.setAttribute("data-theme", 主题);
  } catch (e) {}
})();
</script>
